name: publish

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "From main, use 'dry-run' to verify or 'publish' to publish to crates.io"
        required: true
        default: "dry-run"

permissions:
  actions: read
  contents: read
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Guard
        run: |
          if [ "$INPUTS_CONFIRM" != "dry-run" ] && [ "$INPUTS_CONFIRM" != "publish" ]; then
            echo "confirm must be dry-run or publish"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "This workflow is allowed only from main (got $GITHUB_REF)"
            exit 1
          fi
        env:
          INPUTS_CONFIRM: ${{ inputs.confirm }}

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: "stable"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Verify CI for this revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // "missing"')"
          if [ "$conclusion" != "success" ]; then
            echo "CI for $GITHUB_SHA is $conclusion; refusing to publish"
            exit 1
          fi

      - name: Verify package
        run: cargo publish --dry-run

      - name: Authenticate (Trusted Publishing)
        if: inputs.confirm == 'publish'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: cargo publish (drawset)
        if: inputs.confirm == 'publish'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish
